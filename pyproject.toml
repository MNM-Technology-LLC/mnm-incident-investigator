[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mnm-incident-investigator"
version = "0.1.0"
description = "A local AI incident investigator grounded in real Java service telemetry"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "MNM Associates" }]
dependencies = [
  "fastapi>=0.115.12,<1",
  "uvicorn>=0.34.3,<1",
  "httpx>=0.28.1,<0.29",
  "mcp>=1.12.0,<2",
  "pydantic>=2.11.7,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.0,<2", "ruff>=0.12,<1", "playwright>=1.53,<2", "pyyaml>=6.0.2,<7", "pip-licenses>=5.0,<6"]

[tool.hatch.build.targets.wheel]
packages = ["investigator/mnm_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires the running Java application stack", "live_model: requires a real locally running Ollama model"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
